<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hybrid MPI + RGBD Renderer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
        }
    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">Hybrid Renderer: 32-Layer MPI Background + RGBD Foreground</div>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuration
        const CONFIG = {
            minDepth: 1.0,
            maxDepth: 100.0,
            layers: 32,
            atlasRows: 8,
            atlasCols: 4,
            foregroundScale: 1.0, // Scale factor for depth displacement
            foregroundDepthCutoff: 3.0 // Default distance if depth map is missing
        };

        let camera, scene, renderer;
        let foregroundMesh;

        init();
        animate();

        function init() {
            // 1. Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101010);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 1.6, 0); // Typical VR eye height

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Controls (for debug on desktop)
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.6, -1);
            controls.update();

            // 2. Create MPI Background (32 Cylinders)
            createMPIBackground();

            // 3. Create RGBD Foreground (Displaced Plane)
            createRGBDForeground();

            // Lights (though mostly unlit shaders)
            const light = new THREE.AmbientLight(0xffffff, 1);
            scene.add(light);

            window.addEventListener('resize', onWindowResize);
        }

        function createMPIBackground() {
            // Load Atlas Texture
            const loader = new THREE.TextureLoader();
            // Placeholder path - replace with actual path
            const atlasTexture = loader.load('./background_atlas.png');
            atlasTexture.colorSpace = THREE.SRGBColorSpace;
            atlasTexture.magFilter = THREE.LinearFilter;
            atlasTexture.minFilter = THREE.LinearFilter;

            // Generate Depths (Inverse Depth Distribution)
            // 1/d_i = 1/d_min + i * (1/d_max - 1/d_min) / (N-1)
            const depths = [];
            const i_min = 1.0 / CONFIG.minDepth;
            const i_max = 1.0 / CONFIG.maxDepth;
            for (let i = 0; i < CONFIG.layers; i++) {
                const inv_d = i_min + (i * (i_max - i_min)) / (CONFIG.layers - 1);
                depths.push(1.0 / inv_d);
            }

            // Create 32 Cylinders
            const geometry = new THREE.CylinderGeometry(1, 1, 1, 64, 1, true);
            // Flip normals to view from inside
            geometry.scale(-1, 1, 1);
            // Rotate to align texture correctly (usually needed for equirectangular/cylindrical)
            geometry.rotateY(-Math.PI / 2);

            for (let i = 0; i < CONFIG.layers; i++) {
                const layerDepth = depths[i];

                // Calculate UV offset for this layer
                // Layer 0 is bottom-left (based on Python script logic)
                const col = i % CONFIG.atlasCols;
                const row = Math.floor(i / CONFIG.atlasCols);

                const uSize = 1.0 / CONFIG.atlasCols;
                const vSize = 1.0 / CONFIG.atlasRows;

                const uOffset = col * uSize;
                const vOffset = row * vSize;

                // Custom Shader to sample only the specific tile
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        map: { value: atlasTexture },
                        uOffset: { value: new THREE.Vector2(uOffset, vOffset) },
                        uScale: { value: new THREE.Vector2(uSize, vSize) },
                        opacity: { value: 1.0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D map;
                        uniform vec2 uOffset;
                        uniform vec2 uScale;
                        uniform float opacity;
                        varying vec2 vUv;
                        void main() {
                            // Map 0..1 UV to the specific tile UV
                            vec2 tileUv = vUv * uScale + uOffset;
                            vec4 color = texture2D(map, tileUv);
                            // Pre-multiplied alpha handling if needed, or standard blending
                            gl_FragColor = color;
                            if (color.a < 0.01) discard;
                        }
                    `,
                    transparent: true,
                    side: THREE.BackSide, // Render inside
                    depthWrite: false, // Important for transparency
                    depthTest: true
                });

                const mesh = new THREE.Mesh(geometry, material);

                // Scale cylinder to match depth
                // Note: CylinderGeometry radius is 1. So scaling by depth makes radius = depth.
                mesh.scale.set(-layerDepth, layerDepth, layerDepth); // -x to keep normals inside

                // Adjust height to maintain aspect ratio if needed, 
                // but for panorama usually we just scale uniformly or based on FOV.
                // Assuming equirectangular projection mapped to cylinder:
                // Height needs to cover the vertical FOV. 
                // If input was 360x180, cylinder height should be PI * Radius (approx).
                // Let's assume standard 2:1 equirectangular input mapped to cylinder.
                // mesh.scale.y = layerDepth; 

                scene.add(mesh);
            }
        }

        let foregroundTexture;
        let foregroundImages = [];
        let totalFrames = 20; // Set this to your actual frame count
        let currentFrame = 0;
        let lastFrameTime = 0;
        const fps = 30;
        const frameInterval = 1000 / fps;

        function createRGBDForeground() {
            // 1. Preload Images (Simple approach for small sequences)
            // Assuming images are named 'frame_000000.png', 'frame_000001.png', etc.
            // and located in a 'foreground_sequence' folder.
            const loader = new THREE.TextureLoader();

            for (let i = 0; i < totalFrames; i++) {
                const frameStr = i.toString().padStart(6, '0');
                const path = `./foreground_sequence/frame_${frameStr}.png`;
                // Note: You need to generate these RGBD images first!
                // They should be side-by-side RGB + Depth.
                const tex = loader.load(path);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                foregroundImages.push(tex);
            }

            // Create a placeholder texture initially
            foregroundTexture = foregroundImages[0] || new THREE.Texture();

            // 2. Geometry: High segment plane for displacement
            // Aspect ratio should match the content (single eye). 
            // Assuming side-by-side (2:1 total, so 1:1 per eye content).
            const geometry = new THREE.PlaneGeometry(1.6, 0.9, 128, 128);

            // 3. Shader Material for Displacement
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: foregroundTexture },
                    displacementScale: { value: 0.5 }, // Max displacement in meters
                    baseDepth: { value: 2.0 } // Initial distance from camera
                },
                vertexShader: `
                    uniform sampler2D map;
                    uniform float displacementScale;
                    varying vec2 vUv;
                    varying float vDepth;

                    void main() {
                        vUv = uv;

                        // Calculate UVs for Depth (Right Half)
                        vec2 depthUv = vec2(uv.x * 0.5 + 0.5, uv.y);
                        
                        // Sample Depth (Grayscale)
                        vec4 depthColor = texture2D(map, depthUv);
                        float d = depthColor.r; // 0.0 (far) to 1.0 (near)
                        vDepth = d;

                        // Displacement Logic
                        // We move vertices along the normal (Z axis for plane)
                        // "White" (1.0) comes closer to camera.
                        vec3 newPos = position + normal * d * displacementScale;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D map;
                    varying vec2 vUv;
                    varying float vDepth;

                    void main() {
                        // Calculate UVs for Color (Left Half)
                        vec2 colorUv = vec2(vUv.x * 0.5, vUv.y);
                        
                        vec4 color = texture2D(map, colorUv);
                        
                        // Alpha Test
                        if (color.a < 0.1) discard;
                        
                        gl_FragColor = color;
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });

            foregroundMesh = new THREE.Mesh(geometry, material);

            // Initial Position (will be updated by logic)
            foregroundMesh.position.set(0, 1.6, -2.0);

            scene.add(foregroundMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const now = Date.now();

            // Update Foreground Frame
            if (foregroundImages.length > 0 && now - lastFrameTime > frameInterval) {
                currentFrame = (currentFrame + 1) % totalFrames;

                // Update the texture uniform
                if (foregroundMesh && foregroundMesh.material.uniforms.map.value) {
                    foregroundMesh.material.uniforms.map.value = foregroundImages[currentFrame];
                }

                lastFrameTime = now;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
